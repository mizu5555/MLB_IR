<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Team Manager Assistant</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 20px; }
        .header h1 { font-size: 2.2rem; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header .subtitle { font-size: 1rem; opacity: 0.9; }
        .main-card { 
            background: white; 
            border-radius: 16px; 
            padding: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); 
            min-height: 80vh; 
            display: flex; 
            flex-direction: column; 
        }
        .mode-selector { display: flex; gap: 15px; margin-bottom: 20px; justify-content: center; }
        .mode-btn { 
            padding: 10px 20px; 
            border: 2px solid #e0e0e0; 
            border-radius: 12px; 
            background: white; 
            cursor: pointer; 
            transition: all 0.2s; 
            min-width: 150px; 
            text-align: center; 
        }
        .mode-btn:hover { transform: translateY(-2px); }
        .mode-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .mode-btn .title { font-weight: 600; font-size: 1rem; }
        .mode-btn .desc { font-size: 0.8rem; opacity: 0.8; margin-top: 2px; }
        .status-bar { 
            background: #f8f9fa; 
            padding: 8px 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            display: flex; 
            gap: 20px; 
            font-size: 0.85rem; 
            justify-content: flex-end; 
            align-items: center;
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-dot.green { background: #4caf50; }
        .status-dot.red { background: #f44336; }
        .debug-toggle {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            transition: background 0.2s;
            user-select: none;
            border: 1px solid transparent;
        }
        .debug-toggle:hover { background: #e2e8f0; }
        .debug-toggle.active { background: #fee2e2; color: #c53030; border-color: #feb2b2; }
        .rag-container .query-section { margin-bottom: 25px; }
        .rag-container .query-input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #e0e0e0; 
            border-radius: 12px; 
            font-size: 1rem; 
        }
        .rag-container .query-btn { 
            width: 100%; 
            padding: 15px; 
            margin-top: 15px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            cursor: pointer; 
        }
        .rag-container .query-btn:hover { opacity: 0.9; }
        .rag-container .query-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .rag-container .answer-section { 
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%); 
            border-left: 4px solid #667eea; 
            padding: 25px; 
            border-radius: 12px; 
            margin-top: 30px; 
        }
        .rag-container .answer-text { 
            line-height: 1.8; 
            color: #222; 
            font-size: 1.05rem; 
            background: white; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #e0e0e0; 
            margin-top: 15px; 
            white-space: pre-wrap;
        }
        .search-results { margin-top: 20px; padding-top: 20px; border-top: 1px dashed #e0e0e0; }
        .search-results h3 { font-size: 1.1rem; color: #666; margin-bottom: 10px; }
        details { 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 10px; 
            background: #f8f9fa; 
            margin-top: 10px;
        }
        .details-summary { cursor: pointer; font-weight: 600; color: #667eea; }
        .result-item { 
            background: white; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            padding: 12px; 
            margin-top: 10px; 
        }
        .result-item-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 0.95rem; 
            cursor: pointer;
            user-select: none;
        }
        .result-item-header:hover { color: #667eea; }
        .result-item-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .expand-arrow {
            transition: transform 0.2s;
            font-size: 0.8rem;
        }
        .expand-arrow.expanded {
            transform: rotate(90deg);
        }
        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .type-badge.pitcher { background: #dbeafe; color: #1e40af; }
        .type-badge.batter { background: #fef3c7; color: #92400e; }
        .score { 
            background: #eee; 
            padding: 2px 8px; 
            border-radius: 10px; 
            font-size: 0.8rem; 
        }
        .stats-detail {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
            display: none;
        }
        .stats-detail.show { display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-bottom: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .stat-label {
            color: #666;
            font-size: 0.75rem;
            margin-bottom: 2px;
        }
        .stat-value {
            font-weight: 600;
            color: #222;
        }
        .debug-panel {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 0.85rem;
        }
        .debug-panel h4 { color: #fff; margin-bottom: 10px; }
        .debug-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
        .debug-label { color: #63b3ed; font-weight: bold; }
        .chat-layout { display: flex; flex-direction: column; height: 100%; flex: 1; }
        .chat-window {
            flex: 1;
            background: #f4f6f9;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            max-height: 600px;
            min-height: 400px;
            border: 1px solid #e0e0e0;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message-row { display: flex; align-items: flex-start; max-width: 85%; }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.bot { align-self: flex-start; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .avatar.bot { background: white; margin-right: 12px; border: 2px solid #667eea; }
        .avatar.user { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin-left: 12px; color: white; }
        .bubble { background: white; padding: 15px 20px; border-radius: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); line-height: 1.6; font-size: 1rem; white-space: pre-wrap; word-wrap: break-word; }
        .message-row.bot .bubble { border-top-left-radius: 4px; background: white; color: #333; }
        .message-row.user .bubble { border-top-right-radius: 4px; background: #667eea; color: white; }
        .chat-input-area { display: flex; gap: 10px; background: white; padding: 10px; border-radius: 12px; border: 1px solid #e0e0e0; }
        .chat-input { flex: 1; border: none; outline: none; padding: 10px; font-size: 1rem; resize: none; max-height: 100px; }
        .send-btn { background: #667eea; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; font-size: 1.2rem; }
        .send-btn:hover { transform: scale(1.1); }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }
        .empty-state { text-align: center; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function ExpandableResultCard({ item, index }) {
            const [expanded, setExpanded] = useState(false);
            
            const stats = item.stats || {};
            const isPitcher = item.type === 'pitcher';
            
            // ⭐ 優先顯示的統計（排在前面）
            const priorityStats = isPitcher 
                ? ['ERA', 'WHIP', 'K/9', 'FIP', 'W', 'L', 'SV', 'IP', 'K%', 'BB%']
                : ['AVG', 'HR', 'RBI', 'OPS', 'wRC+', 'wOBA', 'SLG', 'OBP', 'BB%', 'K%'];
            
            // ⭐ 獲取所有可用的統計（優先級排序）
            const allStatsKeys = Object.keys(stats);
            const orderedStats = [];
            
            // 先加入優先統計
            priorityStats.forEach(key => {
                if (stats[key] !== undefined && stats[key] !== null) {
                    orderedStats.push(key);
                }
            });
            
            // 再加入其他統計
            allStatsKeys.forEach(key => {
                if (!priorityStats.includes(key) && stats[key] !== undefined && stats[key] !== null) {
                    orderedStats.push(key);
                }
            });
            
            console.log(`Card ${index}:`, item.player_name, item.type, 'showing', orderedStats.length, 'stats');
            
            return (
                <div className="result-item">
                    <div className="result-item-header" onClick={() => setExpanded(!expanded)}>
                        <div className="result-item-title">
                            <span className={expanded ? 'expand-arrow expanded' : 'expand-arrow'}>▶</span>
                            <span>
                                {item.player_name || 'Unknown'}
                                {item.season && ` (${item.season})`}
                                {item.team && ` - ${item.team}`}
                            </span>
                            <span className={`type-badge ${item.type}`}>
                                {item.type === 'pitcher' ? '投手' : '打者'}
                            </span>
                        </div>
                        <span className="score">
                            Score: {typeof item.score === 'number' ? item.score.toFixed(3) : 'N/A'}
                        </span>
                    </div>
                    
                    <div className={`stats-detail ${expanded ? 'show' : ''}`}>
                        {orderedStats.length > 0 ? (
                            <>
                                <div style={{fontSize: '0.85rem', color: '#666', marginBottom: '8px'}}>
                                    共 {orderedStats.length} 項統計數據
                                </div>
                                <div className="stats-grid">
                                    {orderedStats.map(key => (
                                        <div key={key} className="stat-item">
                                            <div className="stat-label">{key}</div>
                                            <div className="stat-value">{stats[key]}</div>
                                        </div>
                                    ))}
                                </div>
                            </>
                        ) : (
                            <div style={{color: '#999', fontSize: '0.9rem'}}>
                                無詳細統計數據
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            const [mode, setMode] = useState('rag');
            const [query, setQuery] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [showDebug, setShowDebug] = useState(false);
            const [debugData, setDebugData] = useState(null);
            const [result, setResult] = useState(null);
            const [chatHistory, setChatHistory] = useState([]);
            const [lastReferences, setLastReferences] = useState(null);
            const chatEndRef = useRef(null);
            const [status, setStatus] = useState({
                ollama_available: false,
                ollama_model: null,
                database_size: 3252
            });

            useEffect(() => {
                fetch('/api/health')
                    .then(r => r.json())
                    .then(data => setStatus({
                        ollama_available: data.llm_available || false,
                        ollama_model: data.llm_model || null,
                        database_size: 3252
                    }))
                    .catch(err => console.error('載入狀態失敗:', err));
            }, []);

            useEffect(() => {
                if (mode === 'llm' && chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatHistory, mode]);

            const handleQuery = async () => {
                if (!query.trim()) return;
                setLoading(true);
                setError(null);

                try {
                    const response = await fetch('/api/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: query.trim(),
                            mode: mode,
                            history: mode === 'llm' ? chatHistory : []
                        })
                    });

                    const data = await response.json();
                    if (!response.ok || data.error) throw new Error(data.error || '查詢失敗');

                    // ⭐ Debug: 檢查返回的數據
                    console.log('API Response:', data);
                    console.log('Search Results:', data.search_results);
                    console.log('Metrics:', data.metrics);

                    setDebugData({
                        routed: data.routed,
                        structured: data.structured,
                        mode: data.mode,
                        metrics: data.metrics  
                    });

                    if (mode === 'rag') {
                        setResult({
                            answer: data.answer,
                            search_results: data.search_results || []
                        });
                    } else {
                        const newHistory = [
                            ...chatHistory,
                            { role: 'user', content: query.trim() },
                            { role: 'assistant', content: data.answer }
                        ];
                        setChatHistory(newHistory);
                        setLastReferences(data.search_results || []);
                        setQuery('');
                    }
                } catch (err) {
                    console.error('Query error:', err);
                    setError(err.message || '發生錯誤');
                } finally {
                    setLoading(false);
                }
            };

            const renderDebugPanel = () => {
                if (!showDebug || !debugData?.routed) return null;
                const { routed, structured, mode, metrics } = debugData;
                
                return (
                    <div className="debug-panel">
                        <h4>🔧 Debug Info: Query Router</h4>
                        <div className="debug-grid">
                            <div><span className="debug-label">Type:</span> {routed.query_type}</div>
                            <div><span className="debug-label">Intent:</span> {routed.intent}</div>
                            <div><span className="debug-label">Metric:</span> {routed.metric || 'N/A'}</div>
                            <div><span className="debug-label">Season:</span> {routed.seasons?.join(', ') || 'N/A'}</div>
                            <div><span className="debug-label">Players:</span> {routed.players?.join(', ') || 'None'}</div>
                            <div><span className="debug-label">Mode:</span> {mode}</div>
                        </div>
                        
                        {metrics && (
                            <div style={{marginTop: 15}}>
                                <h4>📊 Retrieval Metrics</h4>
                                <div className="debug-grid">
                                    <div><span className="debug-label">Recall@{metrics.k}:</span> {(metrics['recall@k'] * 100).toFixed(1)}%</div>
                                    <div><span className="debug-label">Precision@{metrics.k}:</span> {(metrics['precision@k'] * 100).toFixed(1)}%</div>
                                    <div><span className="debug-label">MRR:</span> {metrics.mrr.toFixed(3)}</div>
                                    <div><span className="debug-label">Relevant:</span> {metrics.relevant_count}/{metrics.total_retrieved}</div>
                                </div>
                            </div>
                        )}
                        
                        {structured && (
                            <div style={{marginTop: 15}}>
                                <h4>📋 Structured Lookup</h4>
                                <div className="debug-grid">
                                    <div><span className="debug-label">Kind:</span> {structured.kind}</div>
                                    <div><span className="debug-label">Results:</span> {structured.results?.length || 0} items</div>
                                </div>
                            </div>
                        )}

                        <details style={{marginTop: 15, border: 'none', background: 'transparent', padding: 0}}>
                            <summary style={{color: '#63b3ed', cursor: 'pointer'}}>📄 View Full JSON</summary>
                            <pre style={{marginTop: 10, background: '#1a202c', padding: 10, borderRadius: 4, overflow: 'auto', color: '#90cdf4'}}>
                                {JSON.stringify(debugData, null, 2)}
                            </pre>
                        </details>
                    </div>
                );
            };

            const renderRagInterface = () => (
                <div className="rag-container">
                    <div className="query-section">
                        <input
                            type="text"
                            className="query-input"
                            placeholder="輸入查詢，例如：大谷 2023 投球"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && !loading && handleQuery()}
                        />
                        <button className="query-btn" onClick={handleQuery} disabled={loading || !query.trim()}>
                            {loading ? '查詢中...' : '🔍 查詢'}
                        </button>
                    </div>

                    {error && <div style={{color: 'red', marginTop: 20}}>❌ {error}</div>}

                    {result && (
                        <div>
                            <div className="answer-section">
                                <h3>✅ 查詢結果</h3>
                                <div className="answer-text">{result.answer}</div>
                            </div>
                            
                            {renderDebugPanel()}
                            
                            {result.search_results && result.search_results.length > 0 && (
                                <div className="search-results">
                                    <details open>
                                        <summary className="details-summary">
                                            查看 {result.search_results.length} 筆原始數據來源（點擊展開）
                                        </summary>
                                        <div>
                                            {result.search_results.map((item, idx) => (
                                                <ExpandableResultCard key={idx} item={item} index={idx} />
                                            ))}
                                        </div>
                                    </details>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );

            const renderLlmInterface = () => (
                <div className="chat-layout">
                    <div className="chat-window">
                        {chatHistory.length === 0 && !loading && (
                            <div className="empty-state">
                                <h3>🤖 MLB 數據分析助手</h3>
                            </div>
                        )}
                        {chatHistory.map((msg, idx) => (
                            <div key={idx} className={`message-row ${msg.role === 'user' ? 'user' : 'bot'}`}>
                                <div className={`avatar ${msg.role === 'user' ? 'user' : 'bot'}`}>
                                    {msg.role === 'user' ? '🧑‍💻' : '🤖'}
                                </div>
                                <div className="bubble">{msg.content}</div>
                            </div>
                        ))}
                        {loading && (
                            <div className="message-row bot">
                                <div className="avatar bot">🤖</div>
                                <div className="bubble">分析中...</div>
                            </div>
                        )}
                        <div ref={chatEndRef} />
                    </div>
                    <div className="chat-input-area">
                        <textarea
                            className="chat-input"
                            placeholder="輸入問題..."
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            onKeyPress={(e) => { if(e.key === 'Enter' && !e.shiftKey && !loading) { e.preventDefault(); handleQuery(); }}}
                            rows={1}
                        />
                        <button className="send-btn" onClick={handleQuery} disabled={loading || !query.trim()}>➤</button>
                    </div>
                </div>
            );

            return (
                <div className="container">
                    <div className="header">
                        <h1>⚾ MLB Team Manager Assistant</h1>
                        <div className="subtitle">棒球數據檢索與分析系統</div>
                    </div>
                    <div className="main-card">
                        <div className="status-bar">
                            <div className="status-item">
                                <div className={`status-dot ${status.ollama_available ? 'green' : 'red'}`}></div>
                                <span>LLM: {status.ollama_available ? status.ollama_model : '不可用'}</span>
                            </div>
                            <div className="status-item">
                                <div className="status-dot green"></div>
                                <span>DB: {status.database_size?.toLocaleString()}</span>
                            </div>
                            <div className={`status-item debug-toggle ${showDebug ? 'active' : ''}`} onClick={() => setShowDebug(!showDebug)}>
                                🐞 Debug
                            </div>
                        </div>
                        <div className="mode-selector">
                            <button className={`mode-btn ${mode === 'rag' ? 'active' : ''}`} onClick={() => setMode('rag')}>
                                <div className="title">🔍 純 RAG 模式</div>
                            </button>
                            <button className={`mode-btn ${mode === 'llm' ? 'active' : ''}`} onClick={() => setMode('llm')} disabled={!status.ollama_available}>
                                <div className="title">💬 AI 對話模式</div>
                            </button>
                        </div>
                        {mode === 'rag' ? renderRagInterface() : renderLlmInterface()}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
