<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <title>MLB Team Manager Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* --- 基礎樣式 (紫色漸層主題) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* --- Header --- */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .header .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* --- Main Card --- */
        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* --- Mode Toggle --- */
        .mode-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .mode-toggle {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }
        .mode-pill {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid transparent;
            cursor: pointer;
            background: #e2e8f0;
            color: #475569;
            transition: all 0.15s;
        }
        .mode-pill.active {
            background: #4f46e5;
            color: white;
            border-color: #4338ca;
            box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.5);
        }
        .mode-label {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* --- Input Area --- */
        .search-area {
            position: relative;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 16px 20px;
            padding-right: 180px;
            font-size: 1.1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s;
            outline: none;
            background: #f8fafc;
        }
        .search-box:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        .search-btn-group {
            position: absolute;
            right: 8px;
            top: 8px;
            bottom: 8px;
            display: flex;
            gap: 6px;
        }
        .search-btn, .clear-btn {
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.1s, background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .clear-btn {
            background: #e2e8f0;
            color: #475569;
        }
        .search-btn:active,
        .clear-btn:active {
            transform: scale(0.96);
        }
        .search-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* --- Examples --- */
        .examples {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .ex-pill {
            font-size: 0.85rem;
            padding: 6px 14px;
            background: #f1f5f9;
            color: #64748b;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .ex-pill:hover {
            background: #e2e8f0;
            color: #334155;
            border-color: #cbd5e1;
        }

        /* --- Section Titles --- */
        .section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        /* --- Chat / Bubbles --- */
        .chat-wrapper {
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-row {
            display: flex;
            margin-bottom: 2px;
        }
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 70%;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .chat-bubble.ai {
            margin-right: auto;
            background: #f1f5f9;
            color: #0f172a;
            border-bottom-left-radius: 4px;
        }
        .chat-bubble.user {
            margin-left: auto;
            background: #4f46e5;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-role {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .chat-bubble.ai .chat-role {
            color: #64748b;
        }
        .chat-bubble.user .chat-role {
            color: #e0e7ff;
            text-align: right;
        }

        /* --- Result Cards (Structured) --- */
        .result-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .metric-hero {
            text-align: center;
            padding: 20px 0;
        }
        .metric-value {
            font-size: 3rem;
            font-weight: 800;
            color: #764ba2;
            line-height: 1;
        }
        .metric-desc {
            font-size: 1rem;
            color: #64748b;
            margin-top: 8px;
        }

        /* --- Tables --- */
        .styled-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            margin-top: 10px;
        }
        .styled-table th {
            text-align: left;
            padding: 12px;
            color: #64748b;
            font-weight: 600;
            border-bottom: 2px solid #f1f5f9;
            font-size: 0.85rem;
        }
        .styled-table td {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }
        .styled-table tr:last-child td {
            border-bottom: none;
        }
        .styled-table tr:hover td {
            background: #f8fafc;
        }

        /* --- Hits (Search Results) --- */
        .hit-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }
        .hit-card:hover {
            border-color: #cbd5e1;
        }
        .hit-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .hit-title {
            font-weight: 600;
            color: #1e293b;
            font-size: 1rem;
        }
        .hit-meta {
            font-size: 0.8rem;
            color: #64748b;
        }
        .hit-score {
            font-size: 0.75rem;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            color: #475569;
            white-space: nowrap;
        }
        .hit-preview {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- Badges --- */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-ranking { background: #dbeafe; color: #1e40af; }
        .badge-comparison { background: #ccfbf1; color: #0f766e; }
        .badge-factual { background: #ffedd5; color: #9a3412; }
        .badge-semantic { background: #f3e8ff; color: #6b21a8; }

        /* --- Debug/Router Info --- */
        details.debug-info {
            margin-top: 30px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 10px;
        }
        details.debug-info summary {
            font-size: 0.8rem;
            color: #94a3b8;
            cursor: pointer;
            list-style: none;
            text-align: center;
        }
        details.debug-info summary:hover {
            color: #64748b;
            text-decoration: underline;
        }
        pre.json-dump {
            background: #1e293b;
            color: #a5b4fc;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-weight: 500;
        }
        .error-msg {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [query, setQuery] = useState("");
            const [mode, setMode] = useState("rag"); // 'rag' or 'llm'
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const [classification, setClassification] = useState(null);
            const [searchResults, setSearchResults] = useState([]);
            const [answer, setAnswer] = useState("");
            const [chat, setChat] = useState([]); // [{role:'user'|'assistant', content:string}]

            async function handleSubmit(e) {
                if (e && e.preventDefault) {
                    e.preventDefault();
                }
                const q = query.trim();
                if (!q) return;

                setLoading(true);
                setError(null);

                try {
                    const payload = {
                        query: q,
                        mode: mode,    // 傳給後端：rag / llm
                        history: chat, // 直接丟整個 chat 給後端當 context
                    };

                    const res = await fetch("/api/query", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload),
                    });

                    const data = await res.json();

                    if (data.error) {
                        throw new Error(data.error);
                    }

                    setClassification(data.classification || null);
                    setSearchResults(data.search_results || []);
                    setAnswer(data.answer || "");

                    if (mode === "llm") {
                        const next = [...chat, { role: "user", content: q }];
                        if (data.answer) {
                            next.push({ role: "assistant", content: data.answer });
                        }
                        setChat(next);
                        setQuery("");
                    } else {
                        // RAG 模式：只顯示最新一輪回答在左邊
                        setChat([]);
                    }

                } catch (err) {
                    setError(err.message || String(err));
                } finally {
                    setLoading(false);
                }
            }

            function handleClear() {
                setQuery("");
                setAnswer("");
                setSearchResults([]);
                setClassification(null);
                setChat([]);
                setError(null);
            }

            function renderChat() {
                // LLM 模式：顯示整個 chat history
                if (mode === "llm") {
                    return (
                        <div className="chat-wrapper">
                            {chat.length === 0 && !answer && (
                                <div style={{fontSize:'0.85rem', color:'#94a3b8'}}>
                                    LLM 對話模式：可以問「大谷 2023 投球」，再接著問「那 2024 呢？」。
                                </div>
                            )}
                            {chat.map((m, idx) => (
                                <div key={idx} className="chat-row">
                                    <div className={"chat-bubble " + (m.role === "user" ? "user" : "ai")}>
                                        <div className="chat-role">
                                            {m.role === "user" ? "You" : "Assistant"}
                                        </div>
                                        <div>{m.content}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    );
                }

                // RAG 模式：把 answer 當作單輪 AI 回答泡泡
                if (answer) {
                    return (
                        <div className="chat-wrapper">
                            <div className="chat-row">
                                <div className="chat-bubble ai">
                                    <div className="chat-role">Assistant</div>
                                    <div>{answer}</div>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="chat-wrapper">
                        <div style={{fontSize:'0.85rem', color:'#94a3b8'}}>
                            資料檢索模式：會回傳結構化數據與檢索來源，適合查排名 / 比較 / 具體指標。
                        </div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <h1>⚾ MLB Team Manager</h1>
                        <div className="subtitle">Intelligent Statistics Retrieval & LLM Assistant</div>
                    </div>

                    <div className="main-card">

                        {/* 模式切換 */}
                        <div className="mode-toggle-row">
                            <div className="mode-toggle">
                                <span className="mode-label">模式：</span>
                                <button
                                    type="button"
                                    className={"mode-pill " + (mode === "rag" ? "active" : "")}
                                    onClick={() => { setMode("rag"); setChat([]); }}
                                >
                                    📊 資料檢索 (RAG)
                                </button>
                                <button
                                    type="button"
                                    className={"mode-pill " + (mode === "llm" ? "active" : "")}
                                    onClick={() => { setMode("llm"); }}
                                >
                                    💬 LLM 對話
                                </button>
                            </div>
                            <div className="mode-label">
                                {mode === "rag" ? "重點在精準數據 & 排名" : "可多輪追問的球探對話"}
                            </div>
                        </div>

                        {/* 搜尋區塊 */}
                        <div>
                            <form className="search-area" onSubmit={handleSubmit}>
                                <input
                                    type="text"
                                    className="search-box"
                                    placeholder="輸入問題，例如：大谷 2023 投球 / 2024 全壘打前 10 名 / 誰 2023 AVG 比 Judge 高？"
                                    value={query}
                                    onChange={e => setQuery(e.target.value)}
                                />
                                <div className="search-btn-group">
                                    <button
                                        type="button"
                                        className="clear-btn"
                                        onClick={handleClear}
                                        disabled={loading && !answer && searchResults.length === 0}
                                    >
                                        清除
                                    </button>
                                    <button
                                        type="submit"
                                        className="search-btn"
                                        disabled={loading}
                                    >
                                        {loading ? "分析中..." : "查詢"}
                                    </button>
                                </div>
                            </form>

                            {/* 快速範例 (僅設定輸入框，不直接送出) */}
                            {!loading && !answer && searchResults.length === 0 && (
                                <div className="examples">
                                    <span className="ex-pill" onClick={() => setQuery("大谷 2023 投球")}>大谷 2023 投球</span>
                                    <span className="ex-pill" onClick={() => setQuery("誰 2023 年全壘打比大谷高？")}>HR 比大谷高？</span>
                                    <span className="ex-pill" onClick={() => setQuery("2024 全壘打前 10 名")}>2024 HR Top 10</span>
                                    <span className="ex-pill" onClick={() => setQuery("誰 2023 AVG 比 Acuna 高？")}>AVG 比 Acuña 高？</span>
                                </div>
                            )}
                        </div>

                        {error && <div className="error-msg">⚠️ {error}</div>}

                        {loading && (
                            <div className="loading-spinner">
                                ⚾ 正在路由查詢與檢索 MLB 數據庫...
                            </div>
                        )}

                        {/* 對話 / 回答區 */}
                        <div>
                            <div className="section-label">Conversation & Answer</div>
                            {renderChat()}
                        </div>

                        {/* 檢索結果 / hits 區塊（保留在對話下方） */}
                        {searchResults && searchResults.length > 0 && (
                            <div style={{marginTop: 20, animation: 'fadeIn 0.4s'}}>
                                <div className="section-label">
                                    Retrieval Context ({searchResults.length})
                                    <span className="badge badge-semantic" style={{marginLeft:'auto'}}>
                                        Hybrid Search
                                    </span>
                                </div>
                                <div>
                                    {searchResults.map((h, idx) => (
                                        <div key={idx} className="hit-card">
                                            <div className="hit-header">
                                                <div>
                                                    <div className="hit-title">
                                                        {h.player || h.player_name || h.id || "Unknown Player"}
                                                        {h.season ? ` · ${h.season}` : ""}
                                                        {h.team ? ` · ${h.team}` : ""}
                                                    </div>
                                                    {h.type && (
                                                        <div className="hit-meta">
                                                            {h.type}
                                                            {typeof h.score === "number" ? ` · score ${h.score.toFixed(3)}` : ""}
                                                        </div>
                                                    )}
                                                </div>
                                                {typeof h.score === "number" && (
                                                    <span className="hit-score">score: {h.score.toFixed(3)}</span>
                                                )}
                                            </div>
                                            <div className="hit-preview">
           

                                                {h.preview || h.embedding_text || h.raw_text || ""}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Debug / Routing Info（如果後端有丟 classification 可以看） */}
                        {classification && (
                            <details className="debug-info">
                                <summary>查看 Query Classification / Debug</summary>
                                <pre className="json-dump">
                                    {JSON.stringify(classification, null, 2)}
                                </pre>
                            </details>
                        )}
                    </div>

                    <div style={{textAlign:'center', marginTop: 20, color: 'white', opacity: 0.6, fontSize: '0.8rem'}}>
                        Powered by Hybrid Search, Query Router & LLM
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
